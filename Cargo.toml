[package]
name        = "kubuno-keestore"
version     = "0.1.8"
edition     = "2021"
description = "Kubuno Keestore — gestionnaire de mots de passe KeePass 4"
license     = "AGPL-3.0"
repository  = "https://github.com/kubuno/keestore"

[[bin]]
name = "kubuno-keestore"
path = "src/main.rs"

# ── Database engine ──────────────────────────────────────────────────────────
# Exactly one, chosen at build time. The engine is baked into the binary, so a
# `.kbpkg` is built per engine (see kubuno-db's README).
#
#   cargo build                                                    # PostgreSQL
#   cargo build --no-default-features --features backend-mysql
#   cargo build --no-default-features --features backend-sqlite
#
# The sqlx driver feature has to be switched here too: cargo features are
# additive, so leaving `sqlx/postgres` on unconditionally would link the
# PostgreSQL driver into a MySQL build.
[features]
default          = ["backend-postgres"]
backend-postgres = ["kubuno-db/backend-postgres", "sqlx/postgres"]
backend-mysql    = ["kubuno-db/backend-mysql", "sqlx/mysql"]
backend-sqlite   = ["kubuno-db/backend-sqlite", "sqlx/sqlite"]

[dependencies]
# Workspace
tokio              = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
async-trait        = { workspace = true }
sqlx               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
reqwest            = { workspace = true }
config             = { workspace = true }
dotenvy            = { workspace = true }
validator          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
kubuno-seccomp     = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true }
chrono             = { workspace = true }
bytes              = { workspace = true }
futures            = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
rand               = { workspace = true }
base64             = { workspace = true }
toml               = { workspace = true }
clap               = { workspace = true }
kubuno-storage     = { workspace = true }
kubuno-db          = { workspace = true }

# ─── Workspace mono-crate (deps tierces recopiées du monorepo kubuno/core ;
#     crates partagées consommées via dépendances git taguées) ───
[dev-dependencies]
tempfile = "3"

[workspace]

[workspace.package]
version      = "0.1.4"
edition      = "2021"
authors      = ["Kubuno Contributors"]
license      = "AGPL-3.0"
repository   = "https://github.com/kubuno/kubuno"
rust-version = "1.82"

[workspace.dependencies]
# Async
tokio       = { version = "1",    features = ["full"] }
# CRDT Yjs côté serveur (consolidation GC des snapshots collab)
yrs         = "0.23"
axum        = { version = "0.7",  features = ["macros", "ws", "multipart"] }
tower       = { version = "0.5",  features = ["full"] }
tower-http  = { version = "0.6",  features = ["cors", "compression-gzip", "trace", "limit", "fs", "set-header", "timeout"] }
async-trait = "0.1"

# Database
# The driver is selected by this crate's `backend-*` features, never here.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "uuid", "chrono", "json", "migrate", "tls-rustls", "bigdecimal", "derive", "macros"] }

# Sérialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Crypto
jsonwebtoken = "9"
argon2       = "0.5"
aes-gcm      = "0.10"
rand         = "0.8"
sha2         = "0.10"
base64       = "0.22"

# HTTP Client (pour proxy modules + CLI upload)
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Config & Env
config  = "0.14"
dotenvy = "0.15"

# Validation
validator = { version = "0.21", features = ["derive"] }

# Logging & Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"
tokio-util         = { version = "0.7", features = ["io"] }
kubuno-storage     = { git = "https://github.com/kubuno/core", tag = "storage-v0.1.1", package = "kubuno-storage" }
kubuno-seccomp     = { git = "https://github.com/kubuno/core", tag = "seccomp-v0.1.1", package = "kubuno-seccomp" }
# TODO(release): swap for the tagged form once kubuno/core carries the tag —
#   kubuno-db = { git = "https://github.com/kubuno/core", tag = "db-v0.1.0", package = "kubuno-db", default-features = false }
# The path form only resolves inside the ~/projects/kubuno checkout; a module
# must build standalone before it can be released.
kubuno-db          = { path = "../core/crates/kubuno-db", default-features = false }

# Erreurs
thiserror = "1"
anyhow    = "1"

# Utils
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes   = "1"
futures = "0.3"
hex     = "0.4"
toml    = "0.8"
clap    = { version = "4", features = ["color", "wrap_help", "derive", "env"] }
url                 = "2"
urlencoding         = "2"
tokio-tungstenite   = { version = "0.24", features = ["native-tls"] }
async-stream        = "0.3"
totp-rs             = { version = "5", features = ["gen_secret", "otpauth"] }
zip                 = "2"
quick-xml           = { version = "0.37", features = ["serialize"] }
